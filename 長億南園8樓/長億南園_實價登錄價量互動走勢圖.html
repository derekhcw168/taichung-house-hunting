          ctx.stroke();
        } else {
          ctx.fillStyle = r.p === 1 ? '#F97316' : '#F43F5E';
          ctx.beginPath();
          ctx.arc(px, py, 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      });
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      let closest = null;
      let minDist = 14;
      for (const pt of plottedPoints) {
        const d = Math.hypot(pt.px - mx, pt.py - my);
        if (d < minDist) {
          minDist = d;
          closest = pt;
        }
      }

      if (closest) {
        const r = closest.r;
        const tag = r.f === '8' ? '<span class="text-yellow-300 font-bold">★ 8樓同層</span>' : (r.sh ? '<span class="text-purple-300">1F店面/特殊</span>' : (r.p ? '<span class="text-orange-300">含車位</span>' : '<span class="text-rose-300">無車位</span>'));
        tooltip.innerHTML = `
          <div class="font-bold text-sky-300 border-b border-slate-700 pb-1 mb-1 flex justify-between gap-2">
            <span>民國 ${r.rd}</span>
            ${tag}
          </div>
          <div class="text-slate-200 font-medium">${r.a}</div>
          <div class="grid grid-cols-2 gap-x-3 gap-y-0.5 mt-1 text-slate-300">
            <div>總價：<b class="text-white">${r.tp} 萬</b></div>
            <div>建坪：<b class="text-white">${r.ar} 坪</b></div>
            <div>591扣車：<b class="text-amber-300">${r.u} 萬/坪</b></div>
            <div>含車原價：<b class="text-emerald-300">${r.su} 萬/坪</b></div>
          </div>
        `;
        tooltip.classList.remove('hidden');
        const leftPos = Math.min(rect.width - 235, Math.max(8, closest.px - 110));
        const topPos = closest.py > 130 ? closest.py - 108 : closest.py + 14;
        tooltip.style.left = leftPos + 'px';
        tooltip.style.top = topPos + 'px';
      } else {
        tooltip.classList.add('hidden');
      }
    });

    canvas.addEventListener('mouseleave', () => tooltip.classList.add('hidden'));
    window.addEventListener('resize', drawChart);
    setTimeout(drawChart, 50);
  </script>
</body>
</html>
